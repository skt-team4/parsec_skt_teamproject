url: http://localhost:19000
tunnel: yumai-tunnel
credentials-file: C:\lsj\skt_team\lsj_skt_teamproject_2\.cloudflared\cert.pem

ingress:
  # 메인 웹 앱
  - hostname: yumai.lsjproject.com
    service: http://localhost:19000
    originRequest:
      noTLSVerify: true
  
  # API 서비스들
  - hostname: yumai-api.lsjproject.com
    path: /chat/*
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      
  - hostname: yumai-api.lsjproject.com
    path: /personas/*
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      
  - hostname: yumai-api.lsjproject.com
    path: /food/*
    service: http://localhost:5001
    originRequest:
      noTLSVerify: true
      
  - hostname: yumai-api.lsjproject.com
    path: /nutrition/*
    service: http://localhost:5003
    originRequest:
      noTLSVerify: true
      
  - hostname: yumai-api.lsjproject.com
    path: /history/*
    service: http://localhost:5004
    originRequest:
      noTLSVerify: true
  
  # 404 catch-all
  - service: http_status:404