<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영양소 분석 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .stat-unit {
            font-size: 16px;
            color: #666;
            margin-left: 5px;
        }
        
        .records-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 24px;
            color: #333;
            font-weight: 600;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .records-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .records-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #e0e0e0;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }
        
        .records-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        
        .records-table tr:hover {
            background: #f8f9fa;
        }
        
        .food-name {
            font-weight: 600;
            color: #333;
        }
        
        .meal-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .meal-breakfast {
            background: #fff3cd;
            color: #856404;
        }
        
        .meal-lunch {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .meal-dinner {
            background: #d4edda;
            color: #155724;
        }
        
        .nutri-score {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: white;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
        }
        
        .score-A { background: #28a745; }
        .score-B { background: #6f42c1; }
        .score-C { background: #fd7e14; }
        .score-D { background: #dc3545; }
        .score-E { background: #6c757d; }
        
        .nutrition-details {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #666;
        }
        
        .nutrition-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .nutrition-label {
            font-weight: 600;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-data {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .page-btn {
            padding: 8px 15px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            gap: 20px;
        }
        
        .bar {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px 8px 0 0;
            position: relative;
            min-height: 20px;
            transition: opacity 0.3s;
        }
        
        .bar:hover {
            opacity: 0.8;
        }
        
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }
        
        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🍽️ 영양소 분석 대시보드</h1>
            <p>YUM:AI 영양소 분석 기록을 한눈에 확인하세요</p>
        </div>
        
        <!-- Statistics Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">총 기록 수</div>
                <div class="stat-value">
                    <span id="totalRecords">0</span>
                    <span class="stat-unit">개</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균 칼로리</div>
                <div class="stat-value">
                    <span id="avgCalories">0</span>
                    <span class="stat-unit">kcal</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">오늘 섭취</div>
                <div class="stat-value">
                    <span id="todayCalories">0</span>
                    <span class="stat-unit">kcal</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최고 영양 점수</div>
                <div class="stat-value">
                    <span id="bestScore">-</span>
                </div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="chart-container">
            <div class="chart-title">식사 타입별 분포</div>
            <div class="bar-chart" id="mealChart"></div>
        </div>
        
        <!-- Records Table -->
        <div class="records-section">
            <div class="section-header">
                <h2 class="section-title">최근 분석 기록</h2>
            </div>
            
            <div class="filters">
                <select class="filter-select" id="mealFilter">
                    <option value="">모든 식사</option>
                    <option value="breakfast">아침</option>
                    <option value="lunch">점심</option>
                    <option value="dinner">저녁</option>
                </select>
                <select class="filter-select" id="limitFilter">
                    <option value="10">10개</option>
                    <option value="20">20개</option>
                    <option value="50">50개</option>
                    <option value="100">100개</option>
                </select>
                <button class="filter-select" onclick="loadHistory()">새로고침</button>
            </div>
            
            <div id="recordsContainer">
                <div class="loading">데이터를 불러오는 중...</div>
            </div>
            
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
    
    <script>
        let currentPage = 1;
        let totalRecords = 0;
        
        // 숫자 포맷팅
        function formatNumber(num, decimals = 0) {
            if (decimals === 0) {
                return Math.round(num).toLocaleString();
            }
            return num.toFixed(decimals);
        }
        
        // 날짜 포맷팅
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ko-KR') + ' ' + 
                   date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
        
        // 통계 로드
        async function loadStatistics() {
            try {
                const response = await fetch('http://localhost:5004/api/get-statistics?userId=guest');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const stats = data.statistics;
                    document.getElementById('totalRecords').textContent = stats.totalRecords;
                    document.getElementById('avgCalories').textContent = formatNumber(stats.averageCalories);
                    
                    // 오늘 칼로리 계산
                    const today = new Date().toDateString();
                    const todayRecords = stats.recentRecords?.filter(r => 
                        new Date(r.timestamp).toDateString() === today
                    ) || [];
                    const todayTotal = todayRecords.reduce((sum, r) => sum + (r.calories || 0), 0);
                    document.getElementById('todayCalories').textContent = formatNumber(todayTotal);
                    
                    // 최고 영양 점수
                    const scores = stats.nutriScoreDistribution || {};
                    const bestScore = scores.A ? 'A' : scores.B ? 'B' : scores.C ? 'C' : '-';
                    document.getElementById('bestScore').innerHTML = 
                        `<span class="nutri-score score-${bestScore}">${bestScore}</span>`;
                    
                    // 식사 타입 차트
                    drawMealChart(stats.mealTypeDistribution || {});
                }
            } catch (error) {
                console.error('통계 로드 실패:', error);
            }
        }
        
        // 식사 타입 차트 그리기
        function drawMealChart(distribution) {
            const container = document.getElementById('mealChart');
            container.innerHTML = '';
            
            const meals = {
                breakfast: { label: '아침', value: distribution.breakfast || 0 },
                lunch: { label: '점심', value: distribution.lunch || 0 },
                dinner: { label: '저녁', value: distribution.dinner || 0 }
            };
            
            const maxValue = Math.max(...Object.values(meals).map(m => m.value), 1);
            
            Object.entries(meals).forEach(([key, data]) => {
                const barDiv = document.createElement('div');
                barDiv.className = 'bar';
                barDiv.style.height = `${(data.value / maxValue) * 100}%`;
                
                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = data.label;
                
                const value = document.createElement('div');
                value.className = 'bar-value';
                value.textContent = data.value;
                
                barDiv.appendChild(label);
                barDiv.appendChild(value);
                container.appendChild(barDiv);
            });
        }
        
        // 기록 로드
        async function loadHistory(page = 1) {
            try {
                const limit = document.getElementById('limitFilter').value;
                const mealType = document.getElementById('mealFilter').value;
                const offset = (page - 1) * parseInt(limit);
                
                let url = `http://localhost:5004/api/get-history?userId=guest&limit=${limit}&offset=${offset}`;
                if (mealType) {
                    url += `&mealType=${mealType}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'success') {
                    totalRecords = data.total;
                    currentPage = page;
                    displayRecords(data.records);
                    updatePagination(data.total, parseInt(limit));
                }
            } catch (error) {
                console.error('기록 로드 실패:', error);
                document.getElementById('recordsContainer').innerHTML = 
                    '<div class="no-data">데이터를 불러올 수 없습니다.</div>';
            }
        }
        
        // 기록 표시
        function displayRecords(records) {
            const container = document.getElementById('recordsContainer');
            
            if (!records || records.length === 0) {
                container.innerHTML = '<div class="no-data">아직 기록이 없습니다.</div>';
                return;
            }
            
            let html = `
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>날짜/시간</th>
                            <th>음식명</th>
                            <th>식사</th>
                            <th>칼로리</th>
                            <th>영양소</th>
                            <th>점수</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            records.forEach(record => {
                const mealClass = `meal-${record.mealType || 'other'}`;
                const mealText = {
                    breakfast: '아침',
                    lunch: '점심',
                    dinner: '저녁'
                }[record.mealType] || '-';
                
                // 주요 영양소 추출
                let nutritionHtml = '';
                if (record.nutritionInfo && record.nutritionInfo.totalNutrients) {
                    const nutrients = record.nutritionInfo.totalNutrients;
                    const items = [];
                    
                    if (nutrients.PROCNT) {
                        items.push(`단백질: ${formatNumber(nutrients.PROCNT.quantity, 1)}g`);
                    }
                    if (nutrients.CHOCDF) {
                        items.push(`탄수화물: ${formatNumber(nutrients.CHOCDF.quantity, 1)}g`);
                    }
                    if (nutrients.FAT) {
                        items.push(`지방: ${formatNumber(nutrients.FAT.quantity, 1)}g`);
                    }
                    
                    nutritionHtml = `<div class="nutrition-details">${items.join(' | ')}</div>`;
                }
                
                const scoreHtml = record.nutriScore?.category ? 
                    `<span class="nutri-score score-${record.nutriScore.category}">${record.nutriScore.category}</span>` : 
                    '-';
                
                html += `
                    <tr>
                        <td>${formatDate(record.timestamp)}</td>
                        <td class="food-name">${record.foodName || '-'}</td>
                        <td><span class="meal-badge ${mealClass}">${mealText}</span></td>
                        <td>${formatNumber(record.calories)}kcal</td>
                        <td>${nutritionHtml}</td>
                        <td>${scoreHtml}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteRecord('${record.id}')">삭제</button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        // 페이지네이션 업데이트
        function updatePagination(total, limit) {
            const totalPages = Math.ceil(total / limit);
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 이전 버튼
            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="loadHistory(${currentPage - 1})">이전</button>`;
            }
            
            // 페이지 번호
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                const active = i === currentPage ? 'active' : '';
                html += `<button class="page-btn ${active}" onclick="loadHistory(${i})">${i}</button>`;
            }
            
            // 다음 버튼
            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="loadHistory(${currentPage + 1})">다음</button>`;
            }
            
            container.innerHTML = html;
        }
        
        // 기록 삭제
        async function deleteRecord(recordId) {
            if (!confirm('이 기록을 삭제하시겠습니까?')) {
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:5004/api/delete-record/${recordId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert('기록이 삭제되었습니다.');
                    loadHistory(currentPage);
                    loadStatistics();
                } else {
                    alert('삭제 실패: ' + data.message);
                }
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            loadHistory();
            
            // 필터 이벤트 리스너
            document.getElementById('mealFilter').addEventListener('change', () => loadHistory(1));
            document.getElementById('limitFilter').addEventListener('change', () => loadHistory(1));
            
            // 자동 새로고침 (30초마다)
            setInterval(() => {
                loadStatistics();
                loadHistory(currentPage);
            }, 30000);
        });
    </script>
</body>
</html>
